name: Test and build desktop

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Test and build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            bundle: nsis
          - os: macos-15
            target: macos-arm64
            bundle: dmg
          - os: macos-15-intel
            target: macos-x64
            bundle: dmg
          - os: ubuntu-22.04
            target: linux-x64
            bundle: deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Frontend tests
        run: |
          npm run typecheck
          npm test
      - name: Core unit and integration tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features
      - name: Build desktop installer
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}
      - name: Stage installer and SHA-256
        run: node scripts/stage-installers.mjs ${{ matrix.target }}
      - name: Stage Windows portable ZIP and SHA-256
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: |
          ./scripts/stage-windows-portable.ps1
          node scripts/stage-installers.mjs --checksum-portable
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: WhaleSwitch-${{ matrix.target }}
          if-no-files-found: error
          path: release-assets/*

  release:
    name: Prepare release installers
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v'))
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check release version
        id: version
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from "node:fs";
          const tag = process.env.GITHUB_REF_NAME.replace(/^release\//, "");
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const tauri = JSON.parse(readFileSync("src-tauri/tauri.conf.json", "utf8"));
          const cargo = readFileSync("src-tauri/Cargo.toml", "utf8").match(/^version = "([^"]+)"$/m)?.[1];
          if (!/^v\d+\.\d+\.\d+$/.test(tag) || tag !== "v" + pkg.version || pkg.version !== tauri.version || pkg.version !== cargo) {
            throw new Error("The release ref must match the npm, Tauri and Rust versions");
          }
          appendFileSync(process.env.GITHUB_OUTPUT, "tag=" + tag + "\n");
          JS
      - uses: actions/download-artifact@v4
        with:
          pattern: WhaleSwitch-*
          path: release-assets
          merge-multiple: true
      - name: Verify all installers and checksums
        run: node scripts/stage-installers.mjs --verify
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          options=(--title "WhaleSwitch $RELEASE_TAG")
          notes="docs/releases/$RELEASE_TAG.md"
          if [[ -f "$notes" ]]; then
            options+=(--notes-file "$notes")
          else
            options+=(--generate-notes)
          fi

          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            options+=(--verify-tag --draft)
          else
            comparison=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" --jq '.status')
            if [[ "$comparison" != identical && "$comparison" != ahead ]]; then
              echo "::error::A release branch must point to a commit already on main."
              exit 1
            fi
            tag=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")
            if [[ -n "$tag" ]]; then
              echo "::error::The release tag already exists."
              exit 1
            fi
            options+=(--target "$GITHUB_SHA" --prerelease)
          fi

          gh release create "$RELEASE_TAG" release-assets/* "${options[@]}"
