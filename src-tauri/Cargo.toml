[package]
name = "whaleswitch"
version = "1.4.0"
description = "Local-first configuration workbench"
edition = "2021"
license = "MIT"

[lib]
name = "whaleswitch_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.12.7", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"
dirs = "6"
tempfile = "3"
fs2 = "0.4"
sha2 = "0.10"
chacha20poly1305 = "0.10"
rand = "0.8"
hex = "0.4"
zeroize = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
url = "2"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust", "vendored"] }
